<!doctype html>
<html lang="en">
<head>
<title>QR Poster · Dinkin' Donut</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
/* A4 check-in poster. Print from the browser (Ctrl/Cmd + P). */
@page{size:A4;margin:0}
body{background:#ddd}
.sheet{width:210mm;height:297mm;margin:20px auto;background:var(--ball);color:var(--choco);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18mm 16mm;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sheet img{width:62mm}
.sheet h1{font-size:30mm;line-height:.9}
.sheet .eyebrow{color:var(--choco);font-size:5mm}
.qr{background:var(--cream);border-radius:10mm;padding:9mm;border:2.5mm solid var(--choco)}
.qr div{width:92mm;height:92mm}.qr svg{width:100%;height:100%}
.sheet p{font:600 7mm/1.25 var(--display);margin:0}
.sheet small{font:500 4.5mm var(--body)}
.tools{text-align:center;margin:20px}
@media print{body{background:none}.sheet{margin:0;box-shadow:none}.tools{display:none}}
@media (max-width:820px){.sheet{transform:scale(.45);transform-origin:top left;margin:0}}
.sheet2{background:#FF5FA2}.sheet2 .eyebrow,.sheet2 h1,.sheet2 p,.sheet2 small{color:#3B2416}
@media print{.sheet{page-break-after:always}}
</style>
</head>
<body>
<div class="tools"><button class="btn pink" onclick="print()">Print poster</button></div>
<div class="sheet">
  <img src="/assets/logo.svg" alt="">
  <div><div class="eyebrow">Dinkin’ Donut · Pickleball club</div><h1>Paddles up!</h1></div>
  <div class="qr"><div id="qr"></div></div>
  <p>Scan to join the queue.<br>We’ll call you to your court.</p>
  <small id="url"></small>
</div>
<script src="/js/config.js"></script>
<script src="/js/qrcode.js"></script>
<script src="/js/common.js"></script>
<script>DD.qr(document.getElementById("qr"), DD.queueUrl(), 400); document.getElementById("url").textContent = location.host + "/queue · Stay glazed.";
</body>
</html>
