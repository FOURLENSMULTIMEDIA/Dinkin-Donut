<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frame Studio · Dink Different</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D2840">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<style>
@font-face{font-family:"DM Sans";font-weight:500;src:url(/assets/fonts/dm-sans-500.woff2)}@font-face{font-family:"DM Sans";font-weight:700;src:url(/assets/fonts/dm-sans-700.woff2)}
:root{--navy:#1D2840;--ink:#141B2E;--brass:#C9A86B;--b2:#9C7A45;--ivory:#F4EFE3;--beige:#EDE4D3}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2E3D60,#141B2E 60%);color:var(--ivory);font:16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 120px}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}header img{width:44px;height:44px}
h1{font:800 clamp(34px,6vw,54px)/1 Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100;margin:0}h1 i{color:var(--brass);font-weight:700;font-variation-settings:"SOFT" 100,"WONK" 1}
.k{font:700 11px "DM Sans";letter-spacing:.32em;text-transform:uppercase;color:var(--brass)}
p.lead{color:rgba(244,239,227,.75);max-width:62ch;margin:10px 0 0}
h2{font:800 22px Fraunces,serif;font-variation-settings:"SOFT" 100;margin:34px 0 14px}h2 span{color:var(--brass);font:700 12px "DM Sans";letter-spacing:.3em;margin-right:10px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tpl{border:1px solid rgba(201,168,107,.35);background:rgba(244,239,227,.04);border-radius:16px;padding:12px;color:inherit;text-align:left;cursor:pointer;font:inherit}
.tpl[aria-pressed=true]{border-color:var(--brass);background:rgba(201,168,107,.12);box-shadow:0 0 0 1px var(--brass)}
.tpl b{display:block;font:800 17px Fraunces,serif;font-variation-settings:"SOFT" 100;margin:8px 0 2px}.tpl small{color:rgba(244,239,227,.65);font-size:12.5px;line-height:1.4;display:block}
.tpl .ico{height:54px;border-radius:10px;background:linear-gradient(180deg,#2A385A,#18213A);position:relative;overflow:hidden}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.drop{display:grid;place-items:center;text-align:center;border:1.5px dashed rgba(201,168,107,.55);border-radius:18px;padding:26px;cursor:pointer;background:rgba(244,239,227,.03)}
.drop b{font:800 20px Fraunces,serif;font-variation-settings:"SOFT" 100}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.thumbs div{position:relative}
.thumbs img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid rgba(201,168,107,.4)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ivory);color:var(--navy);font-weight:700;cursor:pointer;line-height:1}
.thumbs .mv{position:absolute;bottom:4px;left:4px;display:flex;gap:2px}.thumbs .mv button{position:static;width:22px;height:22px;border-radius:6px;font-size:12px}
label.f{display:grid;gap:6px;font-size:13px;color:rgba(244,239,227,.7);flex:1 1 220px}
input[type=text],select{font:inherit;color:var(--ivory);background:rgba(244,239,227,.06);border:1px solid rgba(201,168,107,.35);border-radius:12px;padding:12px 14px;width:100%}
select option{color:#111}
.seg{display:inline-flex;border:1px solid rgba(201,168,107,.4);border-radius:999px;padding:4px;gap:4px}.seg button{border:0;background:transparent;color:inherit;font:700 13px "DM Sans";padding:8px 14px;border-radius:999px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--brass);color:var(--ink)}
.stage{margin-top:16px;background:#0D1220;border-radius:18px;padding:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.strip{display:flex;gap:6px;width:max-content}
.strip canvas{display:block;height:min(300px,62vw);width:auto;border-radius:4px}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,27,46,0),rgba(20,27,46,.96) 30%);display:flex;justify-content:center;gap:10px}
.btn{border:0;border-radius:999px;padding:15px 24px;font:700 15px "DM Sans";cursor:pointer;background:var(--brass);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ivory);box-shadow:inset 0 0 0 1.5px rgba(201,168,107,.6)}
.note{font-size:13px;color:rgba(244,239,227,.6);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="/assets/brand/mark-ivory.svg" alt=""><div><div class="k">Dink Different · for the committee</div><h1>Frame <i>Studio</i></h1></div></header>
  <p class="lead">Turn your court photos into on-brand posts. Choose a layout, add photos, and save the slides. Panoramas join across the carousel, so post every slide in order.</p>

  <h2><span>01</span>Choose a layout</h2>
  <div class="tpls" id="tpls"></div>

  <h2><span>02</span>Add your photos</h2>
  <label class="drop" id="drop"><input type="file" id="file" accept="image/*" multiple hidden><div><b>Add photos</b><div class="note" style="margin:6px 0 0">From your camera roll · the order you add them is the order they appear</div></div></label>
  <div class="thumbs" id="thumbs"></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" type="button" id="sample">Try with sample images</button><span class="note" id="need"></span></div>

  <h2><span>03</span>Words &amp; colour</h2>
  <div class="row">
    <label class="f">Title<input type="text" id="title" value="Opening night." maxlength="32"></label>
    <label class="f">Small line<input type="text" id="kicker" value="Dink Different · Doha, Qatar" maxlength="44"></label>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="seg" id="theme"><button type="button" data-v="navy" aria-pressed="true">Navy</button><button type="button" data-v="beige" aria-pressed="false">Beige</button></div>
    <div class="seg" id="count"></div>
  </div>

  <h2><span>04</span>Preview</h2>
  <div class="stage"><div class="strip" id="strip"></div></div>
  <p class="note" id="hint"></p>
</div>
<div class="cta"><button class="btn" type="button" id="save">Save slides</button><button class="btn ghost" type="button" id="share" hidden>Share to Instagram</button></div>
