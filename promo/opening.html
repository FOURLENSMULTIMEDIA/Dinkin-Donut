<script>
const $ = id => document.getElementById(id), cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), r = (t, a, b) => cl((t - a) / (b - a)), eo = x => 1 - Math.pow(1 - x, 4), io = x => x < .5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2;
const win = (el, a, b, t, f = .5) => { const v = t < a || t > b ? 0 : Math.min(r(t, a, a + f), 1 - r(t, b - f, b)); el.style.opacity = eo(v); return v; };
const TOTAL = 26;
function seek(t) {
  win($("s1"), .4, 4.2, t, .6); $("s1").style.transform = `translateY(${(1 - eo(r(t, .4, 1.4))) * 2}vmin)`;
  win($("s2"), 4.4, 8.2, t, .6); $("s2").style.transform = `scale(${.97 + .03 * eo(r(t, 4.4, 5.6))})`;
  $("rule").style.width = 44 * eo(r(t, .2, 1.6)) + "vmin"; $("rule").style.opacity = 1 - r(t, 7.6, 8.2);
  // the mark assembles: the two D's meet, the net draws, the ball dinks over
  win($("markwrap"), 8.2, 13.8, t, .4); const k = io(r(t, 8.4, 9.8));
  $("dL").setAttribute("transform", `translate(${-70 * (1 - k)} 0)`); $("dR").setAttribute("transform", `translate(${70 * (1 - k)} 0)`);
  $("net").setAttribute("stroke-dashoffset", 130 * (1 - eo(r(t, 9.6, 10.6))));
  const u = io(r(t, 10.6, 12)), bx = 60 + 74 * u, by = 30 + 2 * u - 72 * u * (1 - u);
  $("ball").setAttribute("transform", `translate(${bx} ${by})`); $("ball").setAttribute("opacity", t > 10.5 ? 1 : 0);
  $("arc").setAttribute("opacity", r(t, 11.6, 12.2));
  $("mark").style.transform = `scale(${1 - .06 * eo(r(t, 12, 13.8))})`;
  win($("s4"), 13.8, 18.4, t, .4);
  [["m1", 14], ["m2", 14.8], ["m3", 15.6]].forEach(([id, a]) => { const e = eo(r(t, a, a + .8)); $(id).style.opacity = e; $(id).style.transform = `translateY(${(1 - e) * 2}vmin)`; });
  win($("s5"), 18.4, 22, t, .6); $("s5").style.letterSpacing = (1 - eo(r(t, 18.4, 20))) * .3 + "em";
  $("navy").style.opacity = eo(r(t, 21.6, 22.4));
  win($("s6"), 22, 26.5, t, .5); $("f6a").style.opacity = eo(r(t, 23, 23.8)); $("f6b").style.opacity = eo(r(t, 23.6, 24.4));
  $("grain").style.transform = `translate(${(Math.floor(t * 24) * 37) % 40 - 20}px,${(Math.floor(t * 24) * 53) % 40 - 20}px)`;
  $("grain").style.mixBlendMode = t > 22 ? "screen" : "multiply"; $("grain").style.opacity = t > 22 ? .1 : .28;
}
window.seek = seek; seek(0);
if (!/[?&]render/.test(location.search)) { const t0 = performance.now(); (function f() { seek(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(f); })(); }
